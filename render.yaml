# Blueprint Render — deploy backend SIPRES Kartini (API + PostgreSQL).
# Cara pakai: di dashboard Render → New → Blueprint → hubungkan repo ini.
# Render membaca file ini, membuat database + web service otomatis.
# Dokumentasi: https://render.com/docs/blueprint-spec

databases:
  - name: sipres-db
    databaseName: sipres
    user: sipres
    plan: free
    region: singapore

services:
  - type: web
    name: sipres-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Perintah start (migrasi + seed + jalankan API) diatur di CMD Dockerfile.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sipres-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Secret JWT digenerate otomatis oleh Render (kuat & acak).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      # Admin awal. Password diisi di dashboard Render (tidak ikut ke repo).
      - key: SEED_ADMIN_EMAIL
        value: admin@kartini.sch.id
      - key: SEED_ADMIN_NAME
        value: Administrator
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Email SMTP (opsional) — isi di dashboard bila ingin notifikasi email.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # URL web (untuk tautan verifikasi email) — isi bila web sudah dideploy.
      - key: APP_WEB_URL
        sync: false
      # Batasi origin web bila web dideploy (opsional). Mobile tidak terpengaruh.
      - key: CORS_ORIGIN
        sync: false
